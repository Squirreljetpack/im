name: macOS embed crash

# Throwaway branch workflow: reproduce the `im :embed` segfault that only
# affects binaries linked with the macOS 14 SDK and run on macOS 26.

on:
  workflow_dispatch:
  push:
    branches: ["debug/macos-*"]

permissions:
  contents: read

concurrency:
  group: macos-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-14:
    name: build on macos-14 (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [flag, noflag]
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          test "$(wc -c < assets/model/embed.onnx)" -ge 100000000

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: build14-${{ matrix.variant }}

      - name: Drop the aarch64-apple-darwin rustflags
        if: matrix.variant == 'noflag'
        run: |
          python3 - <<'PY'
          import re
          path = ".cargo/config.toml"
          text = open(path).read()
          pattern = (
              r"# The ort-sys aarch64-apple-darwin archive"
              r".*?rustflags = \[[^\]]*\]\n\n"
          )
          text, n = re.subn(pattern, "", text, flags=re.S)
          assert n == 1, f"expected 1 rustflags block, removed {n}"
          open(path, "w").write(text)
          PY
          git diff -- .cargo/config.toml

      - name: Build with symbols
        env:
          CARGO_PROFILE_RELEASE_STRIP: "none"
        run: cargo build --release -p im

      - name: Inspect binary
        run: |
          file target/release/im
          otool -l target/release/im | grep -A4 LC_BUILD_VERSION
          echo "undefined symbols: $(nm -u target/release/im | wc -l)"
          nm -m target/release/im | grep -i "weak external" | head -40 || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: im-14-${{ matrix.variant }}
          path: target/release/im

  run-26:
    name: run on macos-26 (${{ matrix.variant }})
    needs: build-14
    strategy:
      fail-fast: false
      matrix:
        variant: [flag, noflag]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Environment
        run: |
          sw_vers
          uname -m

      - uses: actions/download-artifact@v4
        with:
          name: im-14-${{ matrix.variant }}
          path: /tmp/im-14

      - name: Run without debugger
        continue-on-error: true
        run: |
          set +e
          chmod +x /tmp/im-14/im
          file /tmp/im-14/im
          printf 'hello\n' | /tmp/im-14/im :embed
          echo "exit=$?"

      - name: lldb backtrace
        if: always()
        run: |
          set +e
          sudo DevToolsSecurity -enable
          printf 'hello\n' > /tmp/im-in.txt
          lldb -b \
            -o 'settings set target.input-path /tmp/im-in.txt' \
            -o run \
            -o 'bt all' \
            -o 'frame select 1' \
            -o quit \
            -- /tmp/im-14/im :embed 2>&1 | tee /tmp/im-lldb.txt
          echo "===== lldb log ====="
          tail -120 /tmp/im-lldb.txt

      - name: Upload lldb log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lldb-14-${{ matrix.variant }}
          path: /tmp/im-lldb.txt
          if-no-files-found: warn
