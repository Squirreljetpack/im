name: macOS embed crash

# Throwaway branch workflow: isolate the `im :embed` segfault that affects the
# cargo-dist release artifact (built on macOS 14 / SDK 14.5) when run on
# macOS 26.

on:
  workflow_dispatch:
  push:
    branches: ["debug/macos-*"]

permissions:
  contents: read

concurrency:
  group: macos-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dist:
    name: dist build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version || true
          test "$(wc -c < assets/model/embed.onnx)" -ge 100000000

      - uses: dtolnay/rust-toolchain@stable
      - name: Toolchain
        run: rustc -Vv
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: dist-${{ matrix.os }}

      - name: Build dist profile with symbols
        env:
          CARGO_PROFILE_DIST_STRIP: "none"
        run: |
          cargo build --profile dist --target aarch64-apple-darwin -p im
          file target/aarch64-apple-darwin/dist/im
          otool -l target/aarch64-apple-darwin/dist/im |
            grep -A4 LC_BUILD_VERSION

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: im-dist-${{ matrix.os }}
          path: target/aarch64-apple-darwin/dist/im

  run-26:
    name: run on macos-26 (${{ matrix.name }})
    needs: build-dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dist-14
            artifact: im-dist-macos-14
          - name: dist-26
            artifact: im-dist-macos-26
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Environment
        run: sw_vers

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/im-test

      - name: Run without debugger
        continue-on-error: true
        run: |
          set +e
          chmod +x /tmp/im-test/im
          file /tmp/im-test/im
          printf 'hello\n' | /tmp/im-test/im :embed
          echo "exit=$?"

      - name: lldb backtrace
        if: always()
        run: |
          set +e
          sudo DevToolsSecurity -enable
          printf 'hello\n' > /tmp/im-in.txt
          lldb -b \
            -o 'settings set target.input-path /tmp/im-in.txt' \
            -o run \
            -o 'process status' \
            -o 'register read pc lr sp x0 x1' \
            -o 'thread backtrace all' \
            -o 'bt all' \
            -o quit \
            -- /tmp/im-test/im :embed 2>&1 | tee /tmp/im-lldb.txt
          tail -160 /tmp/im-lldb.txt

      - name: Upload lldb log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lldb-${{ matrix.name }}
          path: /tmp/im-lldb.txt
          if-no-files-found: warn

  run-official:
    name: run official v0.2.7 asset on macos-26
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Download official release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/im-official
          gh release download v0.2.7 -R Squirreljetpack/im \
            -p 'im-aarch64-apple-darwin.tar.xz' -D /tmp/im-official
          tar -xJf /tmp/im-official/im-aarch64-apple-darwin.tar.xz \
            -C /tmp/im-official
          chmod +x /tmp/im-official/im-aarch64-apple-darwin/im
          shasum -a 256 /tmp/im-official/im-aarch64-apple-darwin/im

      - name: lldb register state
        run: |
          set +e
          sudo DevToolsSecurity -enable
          printf 'hello\n' > /tmp/im-in.txt
          lldb -b \
            -o 'settings set target.input-path /tmp/im-in.txt' \
            -o run \
            -o 'process status' \
            -o 'register read pc lr sp x0 x1' \
            -o 'thread backtrace all' \
            -o 'bt all' \
            -o quit \
            -- /tmp/im-official/im-aarch64-apple-darwin/im :embed \
            2>&1 | tee /tmp/im-lldb.txt
          tail -160 /tmp/im-lldb.txt

      - name: Upload lldb log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lldb-official
          path: /tmp/im-lldb.txt
          if-no-files-found: warn
