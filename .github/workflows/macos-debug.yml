name: official v0.2.8 check

on:
  workflow_dispatch:
  push:
    branches: ["debug/macos-*"]

permissions:
  contents: read

jobs:
  official:
    name: run official v0.2.8 on macos-26
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Run release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/im
          gh release download v0.2.8 -R Squirreljetpack/im \
            -p 'im-aarch64-apple-darwin.tar.xz' -D /tmp/im
          tar -xJf /tmp/im/im-aarch64-apple-darwin.tar.xz -C /tmp/im
          bin=/tmp/im/im-aarch64-apple-darwin/im
          file "$bin"
          printf 'hello\n' | "$bin" :embed > /tmp/embed.txt
          echo "embed_exit=$?"
          wc -w /tmp/embed.txt
          "$bin" :color "glad i got the protocol working" > /tmp/color.txt
          echo "color_exit=$?"
          cat /tmp/color.txt
