name: macOS embed crash

# Throwaway branch workflow: fat LTO drops compiler-rt's
# ___isPlatformVersionAtLeast, and -undefined,dynamic_lookup turns that into a
# null call at ORT env creation. Test forcing the symbol vs other LTO modes.

on:
  workflow_dispatch:
  push:
    branches: ["debug/macos-*"]

permissions:
  contents: read

concurrency:
  group: macos-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: u-fat
            lto: fat
            flags: "-C link-arg=-Wl,-u,___isPlatformVersionAtLeast"
          - name: u-fat-flag
            lto: fat
            flags: >-
              -C link-arg=-Wl,-undefined,dynamic_lookup
              -C link-arg=-Wl,-u,___isPlatformVersionAtLeast
          - name: thin
            lto: thin
            flags: "-C link-arg=-Wl,-undefined,error"
          - name: off
            lto: "off"
            flags: "-C link-arg=-Wl,-undefined,error"
          - name: fat-strict
            lto: fat
            flags: "-C link-arg=-Wl,-undefined,error"
            allow_failure: true
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Environment
        run: |
          sw_vers
          test "$(wc -c < assets/model/embed.onnx)" -ge 100000000

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: ${{ matrix.name }}

      - name: Build with symbols
        continue-on-error: ${{ matrix.allow_failure == true }}
        env:
          CARGO_PROFILE_DIST_STRIP: "none"
          CARGO_PROFILE_DIST_LTO: ${{ matrix.lto }}
          RUSTFLAGS: ${{ matrix.flags }}
        run: |
          set -o pipefail
          cargo build --profile dist --target aarch64-apple-darwin -p im \
            2>&1 | tee /tmp/im-build.txt
          mkdir -p /tmp/out
          cp target/aarch64-apple-darwin/dist/im /tmp/out/im
          llvm-nm -m /tmp/out/im |
            grep "isPlatformVersionAtLeast" || true

      - name: Upload binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: im-${{ matrix.name }}
          path: |
            /tmp/out/im
            /tmp/im-build.txt
          if-no-files-found: warn

  run:
    name: run ${{ matrix.name }} on macos-26
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: u-fat
          - name: u-fat-flag
          - name: thin
          - name: off
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: im-${{ matrix.name }}
          path: /tmp/im-test

      - name: Run without debugger
        continue-on-error: true
        run: |
          set +e
          chmod +x /tmp/im-test/im
          printf 'hello\n' | /tmp/im-test/im :embed
          echo "exit=$?"

      - name: lldb backtrace
        if: always()
        run: |
          set +e
          sudo DevToolsSecurity -enable
          printf 'hello\n' > /tmp/im-in.txt
          cat > /tmp/lldb.cmds <<'EOF'
          settings set target.input-path /tmp/im-in.txt
          settings set interpreter.stop-command-source-on-error false
          run
          process status
          register read pc lr sp x0 x1
          image lookup -a $lr
          thread backtrace all
          bt all
          quit
          EOF
          lldb -b -s /tmp/lldb.cmds -- /tmp/im-test/im :embed \
            2>&1 | tee /tmp/im-lldb.txt
          tail -80 /tmp/im-lldb.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lldb-${{ matrix.name }}
          path: /tmp/im-lldb.txt
          if-no-files-found: warn
