name: macOS embed crash

# Throwaway branch workflow: isolate the `im :embed` segfault in the
# cargo-dist release artifact. Dist inherits release but sets fat LTO and
# codegen-units=1; bisect which one turns the null call on.

on:
  workflow_dispatch:
  push:
    branches: ["debug/macos-*"]

permissions:
  contents: read

concurrency:
  group: macos-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dist
            profile: dist
            extra: ""
          - name: release-lto-fat
            profile: release
            extra: "CARGO_PROFILE_RELEASE_LTO=fat"
          - name: release-cgu1
            profile: release
            extra: "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1"
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Environment
        run: |
          sw_vers
          test "$(wc -c < assets/model/embed.onnx)" -ge 100000000

      - uses: dtolnay/rust-toolchain@stable
      - name: Toolchain
        run: rustc -Vv

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: ${{ matrix.name }}

      - name: Build with symbols
        env:
          CARGO_PROFILE_DIST_STRIP: "none"
          CARGO_PROFILE_RELEASE_STRIP: "none"
        run: |
          set -e
          export ${{ matrix.extra }}
          cargo build --profile ${{ matrix.profile }} \
            --target aarch64-apple-darwin -p im
          mkdir -p /tmp/out
          cp target/aarch64-apple-darwin/${{ matrix.profile }}/im /tmp/out/im
          file /tmp/out/im
          shasum -a 256 /tmp/out/im

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: im-${{ matrix.name }}
          path: /tmp/out/im

  run:
    name: run ${{ matrix.name }} on macos-26
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dist
          - name: release-lto-fat
          - name: release-cgu1
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: im-${{ matrix.name }}
          path: /tmp/im-test

      - name: Run without debugger
        continue-on-error: true
        run: |
          set +e
          chmod +x /tmp/im-test/im
          printf 'hello\n' | /tmp/im-test/im :embed
          echo "exit=$?"

      - name: lldb backtrace
        if: always()
        run: |
          set +e
          sudo DevToolsSecurity -enable
          printf 'hello\n' > /tmp/im-in.txt
          cat > /tmp/lldb.cmds <<'EOF'
          settings set target.input-path /tmp/im-in.txt
          settings set interpreter.stop-command-source-on-error false
          run
          process status
          register read pc lr sp x0 x1
          image lookup -a $lr
          thread backtrace all
          bt all
          quit
          EOF
          lldb -b -s /tmp/lldb.cmds -- /tmp/im-test/im :embed \
            2>&1 | tee /tmp/im-lldb.txt
          tail -160 /tmp/im-lldb.txt

      - name: Crash report
        if: always()
        run: |
          set +e
          sleep 5
          # shellcheck disable=SC2012
          f=$(ls -t ~/Library/Logs/DiagnosticReports/im*.ips \
            2>/dev/null | head -1)
          echo "report: $f"
          [ -n "$f" ] || exit 0
          cp "$f" /tmp/im-crash.ips
          python3 - "$f" <<'PY'
          import json, sys
          lines = open(sys.argv[1]).read().splitlines()
          body = json.loads("\n".join(lines[1:]))
          print("exception:", body.get("exception"))
          imgs = body.get("usedImages", [])
          th = body["threads"][body.get("faultingThread", 0)]
          print("thread:", th.get("name") or th.get("queue") or "?")
          for fr in th["frames"][:40]:
              img = imgs[fr["imageIndex"]]
              print(
                  f'{img.get("name", "?"):24}'
                  f' off=0x{fr.get("imageOffset", 0):x}'
                  f' {fr.get("symbol", "?")}'
                  f' +{fr.get("symbolLocation", 0)}'
              )
          PY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lldb-${{ matrix.name }}
          path: |
            /tmp/im-lldb.txt
            /tmp/im-crash.ips
          if-no-files-found: warn
