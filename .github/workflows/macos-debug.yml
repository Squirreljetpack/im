name: macOS embed crash

# Throwaway branch workflow: fat LTO omits compiler-rt, leaving
# ___isPlatformVersionAtLeast undefined. Test explicitly linking
# libclang_rt.osx.a from the active Xcode toolchain.

on:
  workflow_dispatch:
  push:
    branches: ["debug/macos-*"]

permissions:
  contents: read

concurrency:
  group: macos-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-end:
    name: build with compiler-rt as input
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: test "$(wc -c < assets/model/embed.onnx)" -ge 100000000
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: crt-end
      - name: Build
        env:
          CARGO_PROFILE_DIST_STRIP: "none"
          CARGO_PROFILE_DIST_LTO: fat
        run: |
          set -e
          RT=$("$(xcrun --find clang)" -print-resource-dir)
          RT=$RT/lib/darwin/libclang_rt.osx.a
          ls -l "$RT"
          export RUSTFLAGS="-C link-arg=$RT -C link-arg=-Wl,-undefined,error"
          cargo build --profile dist --target aarch64-apple-darwin -p im
          llvm-nm -m target/aarch64-apple-darwin/dist/im |
            grep isPlatformVersionAtLeast || true
          mkdir -p /tmp/out
          cp target/aarch64-apple-darwin/dist/im /tmp/out/im
      - uses: actions/upload-artifact@v4
        with:
          name: im-crt-end
          path: /tmp/out/im

  run-end:
    name: run compiler-rt-as-input
    needs: build-end
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: im-crt-end
          path: /tmp/im-test
      - name: Run
        continue-on-error: true
        run: |
          set +e
          chmod +x /tmp/im-test/im
          printf 'hello\n' | /tmp/im-test/im :embed
          echo "exit=$?"

  build-force:
    name: build with force_load compiler-rt
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: test "$(wc -c < assets/model/embed.onnx)" -ge 100000000
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: crt-force
      - name: Build
        env:
          CARGO_PROFILE_DIST_STRIP: "none"
          CARGO_PROFILE_DIST_LTO: fat
        run: |
          set -e
          RT=$("$(xcrun --find clang)" -print-resource-dir)
          RT=$RT/lib/darwin/libclang_rt.osx.a
          ls -l "$RT"
          export RUSTFLAGS="-C link-arg=-Wl,-force_load,$RT"
          export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-undefined,error"
          cargo build --profile dist --target aarch64-apple-darwin -p im
          llvm-nm -m target/aarch64-apple-darwin/dist/im |
            grep isPlatformVersionAtLeast || true
          mkdir -p /tmp/out
          cp target/aarch64-apple-darwin/dist/im /tmp/out/im
      - uses: actions/upload-artifact@v4
        with:
          name: im-crt-force
          path: /tmp/out/im

  run-force:
    name: run force_load compiler-rt
    needs: build-force
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: im-crt-force
          path: /tmp/im-test
      - name: Run
        continue-on-error: true
        run: |
          set +e
          chmod +x /tmp/im-test/im
          printf 'hello\n' | /tmp/im-test/im :embed
          echo "exit=$?"
