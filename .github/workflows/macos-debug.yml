name: macOS embed crash

# Throwaway branch workflow: isolate the `im :embed` segfault that affects the
# cargo-dist release artifact (built on macOS 14 / SDK 14.5) when run on
# macOS 26.

on:
  workflow_dispatch:
  push:
    branches: ["debug/macos-*"]

permissions:
  contents: read

concurrency:
  group: macos-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dist-14:
    name: dist build on macos-14 (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [flag, noflag]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version || true
          test "$(wc -c < assets/model/embed.onnx)" -ge 100000000

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: dist14-${{ matrix.variant }}

      - name: Drop the aarch64-apple-darwin rustflags
        if: matrix.variant == 'noflag'
        run: |
          python3 - <<'PY'
          import re
          path = ".cargo/config.toml"
          text = open(path).read()
          pattern = (
              r"# The ort-sys aarch64-apple-darwin archive"
              r".*?rustflags = \[[^\]]*\]\n\n"
          )
          text, n = re.subn(pattern, "", text, flags=re.S)
          assert n == 1, f"expected 1 rustflags block, removed {n}"
          open(path, "w").write(text)
          PY

      - name: Build dist profile with symbols
        env:
          CARGO_PROFILE_DIST_STRIP: "none"
        run: |
          cargo build --locked --profile dist \
            --target aarch64-apple-darwin -p im
          file target/aarch64-apple-darwin/dist/im
          otool -l target/aarch64-apple-darwin/dist/im |
            grep -A4 LC_BUILD_VERSION

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: im-dist-14-${{ matrix.variant }}
          path: target/aarch64-apple-darwin/dist/im

  run-26:
    name: run on macos-26 (${{ matrix.name }})
    needs: build-dist-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dist-flag
            artifact: im-dist-14-flag
          - name: dist-noflag
            artifact: im-dist-14-noflag
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Environment
        run: sw_vers

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/im-test

      - name: Run without debugger
        continue-on-error: true
        run: |
          set +e
          chmod +x /tmp/im-test/im
          file /tmp/im-test/im
          printf 'hello\n' | /tmp/im-test/im :embed
          echo "exit=$?"

      - name: lldb backtrace
        if: always()
        run: |
          set +e
          sudo DevToolsSecurity -enable
          printf 'hello\n' > /tmp/im-in.txt
          lldb -b \
            -o 'settings set target.input-path /tmp/im-in.txt' \
            -o run \
            -o 'bt all' \
            -o 'frame select 1' \
            -o quit \
            -- /tmp/im-test/im :embed 2>&1 | tee /tmp/im-lldb.txt
          tail -120 /tmp/im-lldb.txt

      - name: Upload lldb log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lldb-${{ matrix.name }}
          path: /tmp/im-lldb.txt
          if-no-files-found: warn

  run-official:
    name: run official v0.2.7 asset on macos-26
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Download official release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/im-official
          gh release download v0.2.7 -R Squirreljetpack/im \
            -p 'im-aarch64-apple-darwin.tar.xz' -D /tmp/im-official
          tar -xJf /tmp/im-official/im-aarch64-apple-darwin.tar.xz \
            -C /tmp/im-official
          chmod +x /tmp/im-official/im-aarch64-apple-darwin/im
          shasum -a 256 /tmp/im-official/im-aarch64-apple-darwin/im

      - name: Run without debugger
        continue-on-error: true
        run: |
          set +e
          printf 'hello\n' | /tmp/im-official/im-aarch64-apple-darwin/im :embed
          echo "exit=$?"

      - name: lldb backtrace
        if: always()
        run: |
          set +e
          sudo DevToolsSecurity -enable
          printf 'hello\n' > /tmp/im-in.txt
          lldb -b \
            -o 'settings set target.input-path /tmp/im-in.txt' \
            -o run \
            -o 'bt all' \
            -o quit \
            -- /tmp/im-official/im-aarch64-apple-darwin/im :embed \
            2>&1 | tee /tmp/im-lldb.txt
          tail -120 /tmp/im-lldb.txt

      - name: Upload lldb log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lldb-official
          path: /tmp/im-lldb.txt
          if-no-files-found: warn
