[workspace]
members = [".", "crates/im-dynamic", "crates/jiff-english"]
default-members = [".", "crates/jiff-english"]

[workspace.package]
version = "0.2.5"
edition = "2024"
repository = "https://github.com/Squirreljetpack/im"
homepage = "https://github.com/Squirreljetpack/im"

[workspace.dependencies]
jiff = "0.2"

[workspace.metadata.workspaces]
allow_branch = "main"

[package]
name = "im"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A CLI tool for tracking moods, journaling, habits, metrics, and for managing oneshot, recurring and scheduled tasks"

[[example]]
name = "seed-db"
path = "bin/seed_db.rs"

[dependencies]
cli_boilerplate_automation = { version = "0.*", features = ["serde", "bring"] }
matchmaker-lib = { version = "0.*", features = ["partial", "bracketed-paste"] }

# Stack
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "1.1"

# Date/time
humantime = "2"
jiff = { workspace = true }
jiff-english = { path = "crates/jiff-english", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

anyhow = "1"
thiserror = "2"

# Terminal
crossterm = { version = "0.29", features = ["serde", "event-stream"] }
atty = "0.2"

crokey = "1.3"
futures = "0.3"

# Embeddings: nomic-embed-text-v1.5 INT8 QDQ ONNX via ONNX Runtime (ort)
ort = { version = "2.0.0-rc.13", default-features = false, features = [
  "std",
  "ndarray",
  "tracing",
] }
tokenizers = { version = "0.*", default-features = false, features = ["onig"] }
ureq = { version = "3.*", default-features = false, features = ["rustls"] }
oklab = "1.1"

# Utilities
tempfile = "3"
cliclack = "0.5"
ratatui = "0.30"
mimalloc = "0.1"
dashmap = "6"

dirs = "6"

[dev-dependencies]
# Integration tests still compute expected dates with chrono; the library
# itself only uses jiff (+ jiff-english).
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["download-binaries"]
download-binaries = ["ort/download-binaries", "ort/tls-native", "ort/api-27"]
load-dynamic = ["ort/load-dynamic"]

# Target override: Only build targets supported by static ort-sys prebuilt binaries
[package.metadata.dist]
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[build-dependencies]
ureq = { version = "3.*", default-features = false, features = ["rustls"] }

# Maximum optimization for release builds
[profile.release]
opt-level = 3
strip = true

# Optimize dependencies in dev/test profile (drastically accelerates ONNX Runtime inference)
[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
