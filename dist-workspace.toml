[workspace]
members = ["cargo:.", "cargo:crates/im-dynamic"]

# Config for 'dist'
[dist]
# Force cargo-dist to execute isolated cargo build commands per app to prevent workspace feature unification
precise-builds = true

# ONNX Runtime's static lib for Windows was prebuilt upstream against the dynamic CRT (/MD)
msvc-crt-static = false

# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["powershell", "npm", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "Squirreljetpack/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# A namespace to use when publishing this package to the npm registry
npm-scope = "@squirreljetpack"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = false
# Extra steps injected into build-local-artifacts jobs before `dist build`
github-build-setup = "../build-setup.yml"

[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-24.04"
