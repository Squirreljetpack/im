[moods]

# Mood-to-color anchors live in this file. Generate it by calling `im :moods`.
# source = "moods.toml"

# Instruction prefix for embedding model
prefix_string = "Emotional state: "
# A neutral phrase standing for "no particular mood"; anchor colors are measured from this baseline.
base_string = "Emotional state"

# How decisively the strongest anchor mood wins the final color (1.0 = even mix, higher = dominant).
blend_steepness = 2.0

# How strongly emotional saliency biases the day-average embedding behind a
# tracker-grid dot: per-mood weights are s^k, so 1 = plain saliency weighting,
# higher = the most salient moods of the day dominate its color.
grid_blend_steepness = 1

# How much emotional intensity (saliency) moves a color away from neutral:
# 0 disables it entirely, 100 keeps the full effect.
effective_saliency_gate = 50

# Neutral gray lightness (0-100) used when no anchor mood matches, default 65.
baseline_oklab_l = 65

# An anchor mood must make up at least this % of the color mix to be included at all.
# min_contribution = 7
# top_k = 5

# When true, embeddings/saliency are lazily backfilled when the mood entry is displayed, instead of on insertion.
backfill = true

[tasks]
# colors = ["dark_red", "dark_yellow", "dark_green"]
# default_priority = 5             # 1..=999
# default_recurring_priority = 10
# default_scheduled_priority = 15
# Color for overdue task labels (date column in the today view, the
# preview's `due:` field): pale pink by default.
# overdue_color = "#FFB6C1"

[grid]
# week_rolling = false
# month_rolling = true
# year_rolling = true
# week_start = "Monday"

[preview]
# Show a `last:` field for done tasks in the preview pane.
show_last_when_done = true
# Format dates with abbreviated month names (e.g. "15 Mar 14:30") instead of numeric ("03-15 14:30").
named_months = true

[today_view]
# Merge a task's adjacent completion entries into a single done row
# in the today view.
coalesce_completions = true
# Optional styling for priority and time columns in today view TUI.
# tui_priority_style = { fg = "dark_gray" }
# tui_time_style = { fg = "white" }

[badges]
# Badge for journal-only entries (a mood entry with no mood word): a
# glyph and/or color — '·', "red", or { badge = '·', color = "red" }.
# The color defaults to Reset when unset; omit the key to show no badge.
journal_badge = '·'
# tracker = '◆'   # glyph for tracker entries in the today view
# mood = '●'      # glyph for mood entries (today view + preview markers)

[tasks_view]
# Keep a just-completed task visible in the pending view (@) for this many
# seconds after its last completion entry.
persist_pending_seconds = 300
# Optional styling for priority and time columns in task list TUI.
# tui_priority_style = { fg = "dark_gray" }
# tui_time_style = { fg = "white" }

[editor]
# Body-editor templates per entry kind (arrays): a bare `.` opens the
# editor seeded with the first template, `..` with the second, `...` with
# the third, and so on; out-of-range dot counts fall back to the legacy
# hint line. An empty entry opens a blank document; a non-empty path that
# can't be read warns and opens blank. Lines between two `%%` markers are
# stripped from the saved body (markers included) — use them for
# instructions.
# mood_template = ["templates/mood.txt"]
# task_template = []
# recurring_template = []
# scheduled_template = []
# pomo_prompt = "Thoughts:"

# --- TRACKERS ---
#
# Each tracker is its own section; log it with `-<name> <value>`.
#
# Intervals: with an interval, entries bin into slots of the given span,
# starting from the interval anchor (RFC 3339 timestamps with an explicit
# UTC offset). By default (replace) a new log in a slot replaces the slot's
# previous entry; `cumulative = true` keeps every log and the slot's value
# is the sum of its entries at display time.
#
# Bounds: low/high determine the entry display color AND, with `strict = true`,
# gate logging (CLI and TUI). The bound form follows the kind:
# - float:       plain numbers
# - integer:     plain whole numbers
# - duration:    duration strings ("4m", "1h 30m") — values too
# - text:        whole numbers — message length in characters; meaningful
#                only with strict, otherwise the bounds are dropped
# - null:        replace mode -> duration strings (seconds-from-interval-start
#                time offsets); cumulative mode -> plain whole numbers (count
#                thresholds)
# If high < low, the color semantics are reversed, with numbers closer to
# `high` mapping to earlier colors.
#
# Kinds:
# null:
#  - Timestamp marker (no payload; log with `im -<name>`). Requires an interval.
#  - Replace mode: one marker per period; low/high are seconds-from-interval-start
#    offsets defining the circular color range (and the strict "when" zone).
#  - Cumulative mode: counts occurrences; low/high are count thresholds.
#  - Null trackers don't accept a payload and cannot be _followed by_ a mood.
# float | integer:
#  - Values are plain numbers (integers must be whole). `-rating 4h` is an error.
# duration:
#  - Values are duration strings, stored as seconds and displayed as
#    "6m 30s". `-mile 390` is an error — write `-mile 6m 30s`.
# text:
#  - Plain text entry; the value is stored verbatim.
#  - colors override is limited to length 1.
# strict:
#  - With low/high: numeric kinds reject values outside the inclusive span;
#    text rejects messages whose length in characters is outside it; null
#    (replace mode) rejects logs whose timestamp falls outside the circular
#    low/high offset zone.

[tracker.sleep]
kind = "null"
interval = { anchor = "2026-01-01T00:00:00-04:00", span = "1 day" }
# Replace mode: low/high are seconds-from-interval-start offsets for the
# circular color range — 20:00 local is the "low" end, 04:00 the "high" end
# (wrapping past midnight).
low = "20h"
high = "4h"
colors = [
  "#3f6b93",
  "#355B8F",
  "#2C4B8B",
  "#233B87",
  "#1a2b83",
  "#393075",
  "#573462",
  "#75384F",
  "#933c3c",
]

[tracker.awake]
kind = "null"
interval = { anchor = "2026-01-01T00:00:00-04:00", span = "1 day" }
low = "4h"
high = "12h"
colors = ["#1E3E72", "#786FA6", "#C88EA7", "#F5E1A4", "#F5B752", "#E08955"]

[tracker.rating]
kind = "float"
interval = { anchor = "2026-01-01T00:00:00-04:00", span = "1 day" }
low = 0
high = 9
# strict rejects values outside the inclusive [0, 9] span at log time.
strict = true
# colors = [
#   "#580000",
#   "#800000",
#   "#a63b00",
#   "#c66e00",
#   "#dfa000",
#   "#a0b000",
#   "#4da622",
#   "#008c48",
#   "#007766"
# ]
colors = [
  "#d32f2f",
  "#f57c00",
  "#fbc02d",
  "#c0ca33",
  "#7cb342",
  "#43a047",
  "#00acc1",
  "#1e88e5",
  "#5e35b1",
  "#8e24aa",
]

[tracker.pushups]
kind = "integer"
interval = { anchor = "2026-01-01T00:00:00-04:00", span = "1 day", cumulative = true }
low = 10
# cumulative: every log in the period is kept; the period's grid dot shows
# the sum of its values.

# mile run time, e.g. -mile 6m 30s
[tracker.mile]
kind = "duration"
interval = { anchor = "2026-01-01T00:00:00-04:00", span = "1 day" }
low = "4m"
high = "10m"
# Values are duration strings, stored as seconds and displayed as "6m 30s".

[tracker.win]
kind = "text"
colors = ["#b5b224"]

[tracker.thought]
kind = "text"

[tracker.grateful]
kind = "text"
colors = ["#a7347e"]
