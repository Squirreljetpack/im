# colors.toml — named color palettes (themes) for tracker binning.
#
# Trackers in config.toml reference a theme here by name
# (`colors = "rating"`), or specify an inline list (`colors = ["red", "blue"]`).
# When a tracker sets no `colors`, or names a missing theme, it uses the
# fallback palette defined in code (`DEFAULT_PALETTE`).
#
# The bundled file is the source of truth: `im` falls back to it whenever the
# user's colors.toml is missing or unparsable.

# --- themes named by the bundled config.toml ---

